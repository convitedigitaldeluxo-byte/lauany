<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#021b3b">
<title>Lauany – XV Anos</title>
<meta name="description" content="Você é nosso convidado! Lauany XV Anos – 13 de março de 2027, às 20:30, no Diamond Eventos, Itapeba, Maricá.">
<meta property="og:title" content="Lauany – XV Anos">
<meta property="og:description" content="13 de março de 2027, às 20:30 · Diamond Eventos, Itapeba – Maricá">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lauany.convitedigitaldeluxo.com/">
<meta property="og:image" content="https://lauany.convitedigitaldeluxo.com/preview.jpg">
<meta property="og:image:width" content="630">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#021b3b;
    --navy-deep:#000e2c;
    --gold:#d9a86c;
    --gold-light:#f3d7a6;
    --cream:#fbf1de;
    --ratio: 941 / 1672;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--navy-deep);overflow:hidden}
  body{
    font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}

  /* Fundo desfocado que preenche as laterais / topo em qualquer tela */
  .backdrop{position:fixed;inset:-60px;z-index:0;overflow:hidden}
  .backdrop img{
    width:100%;height:100%;object-fit:cover;
    filter:blur(30px) brightness(.5) saturate(1.15);
    transition:opacity .8s ease;
  }

  .screen{position:fixed;inset:0;z-index:1;display:grid;place-items:center}

  /* Palco com a proporção exata do convite */
  .stage{
    position:relative;
    width:min(100vw, calc(100vh * 941 / 1672));
    width:min(100vw, calc(100dvh * 941 / 1672));
    aspect-ratio:var(--ratio);
    container-type:inline-size;
    box-shadow:0 20px 80px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .stage > img, .stage > video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;
    user-select:none;-webkit-user-select:none;
  }

  /* ---------- Página 1: envelope ---------- */
  .open-btn{
    position:absolute;inset:0;z-index:2;
    background:none;border:0;cursor:pointer;
    font:inherit;color:inherit;
  }
  .open-btn:focus-visible{outline:2px solid var(--gold-light);outline-offset:-6px}
  .seal-ring{
    position:absolute;left:44.8%;top:51.6%;
    width:21.5%;aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1.5px solid rgba(255,222,165,.9);
    box-shadow:0 0 18px 2px rgba(255,200,120,.45);
    animation:pulse 2.2s ease-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%{transform:translate(-50%,-50%) scale(.92);opacity:.95}
    70%{transform:translate(-50%,-50%) scale(1.35);opacity:0}
    100%{transform:translate(-50%,-50%) scale(1.35);opacity:0}
  }
  .hint{
    position:absolute;left:0;right:0;bottom:0;z-index:1;
    padding:22cqw 8cqw 9cqw;
    background:linear-gradient(to bottom, transparent, rgba(0,12,34,.82) 70%);
    text-align:center;
    font-style:italic;font-weight:500;
    font-size:20px;font-size:6cqw;line-height:1.2;text-wrap:balance;
    color:var(--gold-light);
    text-shadow:0 1px 10px rgba(0,0,0,.6);
    pointer-events:none;
  }
  .intro-ui{transition:opacity .4s ease}
  .opening .intro-ui{opacity:0}

  /* Brilho de transição entre o envelope e o convite */
  .flash{
    position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 55%, rgba(255,236,196,.95), rgba(242,196,120,.55) 35%, rgba(2,27,59,0) 75%);
    transition:opacity .45s ease;
  }
  .flash.on{opacity:1}

  /* ---------- Página 2: convite ---------- */
  #convite .stage{opacity:0;transform:scale(.965);transition:opacity .9s ease, transform 1.1s cubic-bezier(.2,.7,.2,1)}
  #convite.show .stage{opacity:1;transform:none}

  .hot{
    position:absolute;z-index:2;display:block;
    background:none;border:0;cursor:pointer;border-radius:12px;
    font:inherit;color:inherit;
  }
  .hot .ring{
    position:absolute;left:3.3%;top:2.7%;width:93.3%;height:74.7%;
    border-radius:50%;
    transition:box-shadow .25s ease, background-color .25s ease;
  }
  .hot:hover .ring, .hot:focus-visible .ring{
    box-shadow:0 0 0 2px rgba(255,218,160,.9), 0 0 30px 8px rgba(255,190,110,.45);
  }
  .hot:active .ring{
    background-color:rgba(255,214,150,.12);
    box-shadow:0 0 0 2px rgba(255,226,180,1), 0 0 36px 12px rgba(255,190,110,.6);
  }
  .hot:focus{outline:none}
  .hot.text-link:focus-visible, .hot.pix:focus-visible{outline:2px dashed var(--gold-light);outline-offset:2px}

  /* Um único brilho sequencial para mostrar o que é clicável */
  .shimmer .ring{animation:shine 1.3s ease-in-out both}
  .shimmer .hot:nth-of-type(2) .ring{animation-delay:.18s}
  .shimmer .hot:nth-of-type(3) .ring{animation-delay:.36s}
  @keyframes shine{
    0%,100%{box-shadow:0 0 0 0 rgba(255,210,150,0)}
    45%{box-shadow:0 0 0 2px rgba(255,222,170,.9), 0 0 34px 10px rgba(255,190,110,.5)}
  }

  /* ---------- Dicas de presente ---------- */
  .gifts{
    position:fixed;inset:0;z-index:6;display:grid;place-items:center;
    background:rgba(0,8,26,.9);
    opacity:0;transition:opacity .3s ease;
  }
  .gifts .stage{transform:translateY(18px);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
  .gifts.open{opacity:1}
  .gifts.open .stage{transform:none}
  .hot.pix{border-radius:10px}
  .hot.pix:hover, .hot.pix:active{background:rgba(255,214,150,.1);box-shadow:0 0 0 1.5px rgba(255,218,160,.8)}
  .gifts.open .hot.pix{animation:pixshine 1.4s .5s ease-in-out both}
  @keyframes pixshine{
    0%,100%{box-shadow:0 0 0 0 rgba(255,210,150,0)}
    45%{box-shadow:0 0 0 1.5px rgba(255,222,170,.9), 0 0 24px 6px rgba(255,190,110,.4)}
  }

  /* Botões redondos (música / voltar) */
  .round{
    position:fixed;z-index:8;
    top:calc(env(safe-area-inset-top, 0px) + 12px);
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;
    background:rgba(2,24,56,.62);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid var(--gold);color:var(--gold-light);
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .round:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
  .round svg{width:20px;height:20px}
  #music{right:calc(env(safe-area-inset-right, 0px) + 12px)}
  #music .off{display:none}
  #music[aria-pressed="false"] .on{display:none}
  #music[aria-pressed="false"] .off{display:block}
  .gifts .back{left:calc(env(safe-area-inset-left, 0px) + 12px)}

  .toast{
    position:fixed;z-index:9;left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform:translate(-50%, 20px);opacity:0;
    padding:10px 20px;border-radius:999px;
    background:rgba(2,24,56,.92);border:1px solid var(--gold);
    color:var(--gold-light);font-size:18px;font-weight:500;white-space:nowrap;
    transition:opacity .25s ease, transform .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion: reduce){
    .seal-ring{animation:none;transform:translate(-50%,-50%)}
    .shimmer .ring, .gifts.open .hot.pix{animation:none}
    #convite .stage, .gifts .stage{transition:opacity .4s ease;transform:none}
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"><img id="backdropImg" src="capa.jpg" alt=""></div>

<!-- Página 1: envelope animado -->
<section id="intro" class="screen" aria-label="Envelope do convite">
  <div class="stage">
    <video id="envelope" poster="capa.jpg" muted playsinline webkit-playsinline preload="auto">
      <source src="abertura.mp4" type="video/mp4">
      <source src="abertura.webm" type="video/webm">
    </video>
    <span class="seal-ring intro-ui" aria-hidden="true"></span>
    <p class="hint intro-ui">Toque no selo para abrir o convite</p>
    <button class="open-btn" id="openBtn" aria-label="Abrir o convite"></button>
  </div>
</section>

<!-- Página 2: convite -->
<section id="convite" class="screen" aria-label="Convite" hidden>
  <div class="stage" id="conviteStage">
    <img src="convite.jpg" alt="Momentos especiais merecem ser comemorados com pessoas como você! Lauany, XV Anos. 13 de março de 2027, às 20:30. Diamond Eventos, R. Clarice Lispector, 54A – Itapeba.">

    <a class="hot" style="left:8.82%;top:58.91%;width:25.5%;height:17.94%"
       href="https://wa.me/5521998897600?text=Confirmo%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20da%20Lauany"
       target="_blank" rel="noopener" aria-label="Confirmar presença pelo WhatsApp"><span class="ring"></span></a>

    <button class="hot" id="giftBtn" type="button" style="left:36.88%;top:58.91%;width:25.5%;height:17.94%"
       aria-label="Ver dicas de presente"><span class="ring"></span></button>

    <a class="hot" style="left:65.89%;top:58.91%;width:25.5%;height:17.94%"
       href="https://www.google.com/maps/search/?api=1&amp;query=Diamond%20Eventos%2C%20Rua%20Clarice%20Lispector%2C%2054A%20-%20Itapeba%2C%20Maric%C3%A1%20-%20RJ%2C%2024913-450"
       target="_blank" rel="noopener" aria-label="Abrir localização no mapa"><span class="ring"></span></a>

    <a class="hot text-link" style="left:26%;top:52.9%;width:48%;height:4.9%"
       href="https://www.google.com/maps/search/?api=1&amp;query=Diamond%20Eventos%2C%20Rua%20Clarice%20Lispector%2C%2054A%20-%20Itapeba%2C%20Maric%C3%A1%20-%20RJ%2C%2024913-450"
       target="_blank" rel="noopener" aria-label="Endereço: Rua Clarice Lispector, 54A – Itapeba, Maricá. Abrir no mapa"></a>
  </div>
</section>

<!-- Dicas de presente -->
<div id="presentes" class="gifts" role="dialog" aria-modal="true" aria-label="Lista de presentes" hidden>
  <div class="stage">
    <img src="lista-presentes.jpg" alt="Lista de presentes de 15 anos: 1. PIX 21 97993-4480 (Lauany). 2. Blusas e croppeds (GG). 3. Shorts (48) e vestidos longos (GG). 4. Tênis, chinelo e sandália (40). 5. Joias: brinco, cordão e pulseira. 6. Perfume, body splash corporal e de cabelo. 7. Hidratante corporal. 8. Gloss (exceto de mel). 9. Sabonete líquido de rosto e corporal. 10. Coisas no geral: pelúcia, relógio, cesta de chocolate e doces.">
    <button class="hot pix" id="pixBtn" type="button" style="left:22.3%;top:31.4%;width:48.9%;height:4.4%"
       aria-label="Copiar chave PIX 21 97993-4480"></button>
  </div>
  <button class="round back" id="closeGifts" type="button" aria-label="Voltar ao convite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<button class="round" id="music" type="button" aria-label="Música" aria-pressed="true" hidden>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></svg>
</button>

<div class="flash" id="flash" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<audio id="song" src="musica.mp3" loop preload="auto"></audio>


<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var intro = $('intro'), convite = $('convite'), video = $('envelope'),
      song = $('song'), musicBtn = $('music'), flash = $('flash'),
      gifts = $('presentes'), giftBtn = $('giftBtn'), closeBtn = $('closeGifts'),
      toast = $('toast'), backdropImg = $('backdropImg');

  var started = false, revealed = false, wantMusic = true;

  /* ---- Música ---- */
  function playSong(){
    song.volume = 0.85;
    var p = song.play();
    if (p && p.catch) p.catch(function(){});
    musicBtn.hidden = false;
  }
  function setMusic(on){
    wantMusic = on;
    musicBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', on ? 'Pausar música' : 'Tocar música');
    if (on) playSong(); else song.pause();
  }
  musicBtn.addEventListener('click', function(){ setMusic(song.paused); });

  // Tenta tocar já ao abrir (alguns navegadores permitem); senão toca no primeiro toque.
  var auto = song.play();
  if (auto && auto.then) auto.then(function(){ musicBtn.hidden = false; }).catch(function(){});

  // Pausa quando o convidado sai (WhatsApp, Mapa) e retoma ao voltar
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) song.pause();
    else if (wantMusic && started) playSong();
  });

  /* ---- Página 1 → Página 2 ---- */
  function reveal(){
    if (revealed) return;
    revealed = true;
    flash.classList.add('on');
    setTimeout(function(){
      intro.hidden = true;
      convite.hidden = false;
      backdropImg.src = document.querySelector('#convite img').src;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        convite.classList.add('show');
        flash.classList.remove('on');
      }); });
      setTimeout(function(){
        var st = $('conviteStage');
        st.classList.add('shimmer');
        setTimeout(function(){ st.classList.remove('shimmer'); }, 2000);
      }, 1100);
    }, 420);
  }

  $('openBtn').addEventListener('click', function(){
    if (started) return;
    started = true;
    intro.classList.add('opening');
    if (wantMusic) playSong();
    if (failed) { reveal(); return; }
    var fallback = setTimeout(reveal, 7000);
    video.addEventListener('ended', function(){ clearTimeout(fallback); reveal(); }, { once:true });
    try {
      var p = video.play();
      if (p && p.catch) p.catch(function(){ clearTimeout(fallback); reveal(); });
    } catch(e){ clearTimeout(fallback); reveal(); }
  });
  var failed = false;
  function videoFailed(){ failed = true; if (started) reveal(); }
  video.addEventListener('error', videoFailed);
  var sources = video.querySelectorAll('source');
  if (sources.length) sources[sources.length - 1].addEventListener('error', videoFailed);

  /* ---- Dicas de presente ---- */
  function openGifts(){
    gifts.hidden = false;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ gifts.classList.add('open'); }); });
    try { history.pushState({ presentes:true }, ''); } catch(e){}
    closeBtn.focus();
  }
  function closeGifts(fromHistory){
    if (gifts.hidden) return;
    gifts.classList.remove('open');
    setTimeout(function(){ gifts.hidden = true; }, 300);
    if (!fromHistory) { try { if (history.state && history.state.presentes) history.back(); } catch(e){} }
    giftBtn.focus();
  }
  giftBtn.addEventListener('click', openGifts);
  closeBtn.addEventListener('click', function(){ closeGifts(false); });
  gifts.addEventListener('click', function(e){ if (e.target === gifts) closeGifts(false); });
  window.addEventListener('popstate', function(){ closeGifts(true); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeGifts(false); });

  /* ---- Copiar PIX ---- */
  var toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }
  function fallbackCopy(text){
    var t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', '');
    t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(t);
    return ok;
  }
  $('pixBtn').addEventListener('click', function(){
    var key = '21979934480';
    var done = function(){ showToast('Chave PIX copiada'); };
    var fail = function(){ showToast(fallbackCopy(key) ? 'Chave PIX copiada' : 'PIX: 21 97993-4480'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(key).then(done, fail);
    else fail();
  });
})();
</script>
</body>
</html>
